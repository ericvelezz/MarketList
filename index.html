<!DOCTYPE html>
<html lang="ca"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d5fd1"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="MarketList">
<title>MarketList</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Baloo+2:wght@800&display=swap">
<style>
:root{--acc:#1d5fd1;--bg:#dcefff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:#16202e}
body{max-width:520px;margin:0 auto;min-height:100vh;padding:0 14px 40px}
header{display:flex;align-items:center;gap:10px;padding:12px 0;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
header h1{font-size:19px;margin:0;flex:1}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:#fff;color:#16202e;cursor:pointer}
button:disabled{opacity:.4}
.pri{background:var(--acc);color:#fff;font-weight:600}.sec{background:#fff;color:var(--acc);font-weight:600}
.ic{width:44px;height:44px;padding:0;font-size:22px}
.big{display:block;width:100%;padding:34px 10px;font-size:24px;margin:18px 0;border-radius:20px;background:var(--acc);color:#fff;font-weight:700}
.card{background:#fff;border-radius:16px;padding:12px 14px;margin:10px 0;box-shadow:0 1px 3px #0001}
.card h4{margin:0 0 6px}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.it{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #0001}
.it span{flex:1}.it button{flex:0;padding:6px 10px;background:#0000;color:#b3261e}
input,select,textarea{font:inherit;width:100%;padding:12px;border:1.5px solid #0002;border-radius:12px;margin:5px 0;background:#fff}
input[type=checkbox]{width:26px;height:26px;margin:0;accent-color:var(--acc)}
label{font-size:13px;opacity:.75}
.chip{display:inline-block;padding:9px 14px;margin:4px 6px 4px 0;border-radius:20px;background:#fff;border:1.5px solid var(--acc);cursor:pointer}
.chip.on{background:var(--acc);color:#fff}
.link{background:none;color:var(--acc);text-decoration:underline;width:100%}
.dim{opacity:.6;text-align:center;padding:18px}
#side{position:fixed;top:0;bottom:0;left:0;width:78%;max-width:310px;background:#fff;z-index:20;padding:calc(env(safe-area-inset-top,0px) + 70px) 14px 20px;transform:translateX(-105%);transition:.2s;overflow:auto;box-shadow:2px 0 14px #0003}
#side.open{transform:none}#side button{display:block;width:100%;text-align:left;margin:4px 0;background:#f2f5fa}
#side .new{background:var(--acc);color:#fff;font-weight:700;text-align:center;margin-bottom:12px}
#side{border-radius:0 18px 18px 0}.burger{position:relative;z-index:30}
#md{position:fixed;inset:0;background:#0007;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
#md>div{background:#fff;border-radius:18px;padding:20px;width:100%;max-width:400px}
.sw{display:inline-block;width:44px;height:44px;border-radius:50%;margin:6px;border:3px solid #fff;box-shadow:0 0 0 1px #0003;cursor:pointer}
.warn{background:#fff6d6;border-radius:12px;padding:10px;font-size:14px;margin:10px 0}
.hrow{display:flex;gap:8px}.hrow>*{margin-top:12px}
html,body{font-family:Nunito,system-ui,-apple-system,'Segoe UI',sans-serif}
body{background:radial-gradient(circle at 90% 5%,#fff8,#fff0 45%),radial-gradient(circle at 5% 95%,#fff6,#fff0 40%),var(--bg);background-attachment:fixed}
.home{min-height:100vh;display:flex;flex-direction:column;padding-top:8px}
.hb{text-align:center;padding-top:22px}
.logo{width:88px;height:88px;margin:0 auto 6px;border-radius:26px;border:2px dashed #0003;background:#fff9;display:flex;align-items:center;justify-content:center;font-size:40px}
.brand{font-family:'Baloo 2','Trebuchet MS',sans-serif;font-weight:800;letter-spacing:.5px;font-size:46px;color:var(--acc);line-height:1.3;text-shadow:0 2px 0 #fff}
.brand.sm{font-size:32px;text-align:center;margin-bottom:14px}
.tag{text-align:center;opacity:.7;margin:4px 0 0}
.hm{flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px;padding-bottom:50px}
.tile{display:flex;align-items:center;gap:16px;width:100%;padding:26px 20px;border-radius:28px;color:#fff;font-size:26px;font-weight:800;text-align:left;box-shadow:0 14px 26px -10px #0005}
.tile i{font-style:normal;font-size:40px;background:#fff3;border-radius:50%;width:72px;height:72px;display:flex;align-items:center;justify-content:center;flex:none}
.tile small{display:block;font-size:14px;font-weight:600;opacity:.9;margin-top:2px}
.card{border-radius:20px;border-left:7px solid var(--ac2,#4aa3ff);box-shadow:0 6px 16px -8px #0003}
.card h4{font-size:18px}.pad{padding:18px}.ttl{font-size:21px;font-weight:800;margin-bottom:8px}
.note{font-size:13px;opacity:.75;margin:2px 0 6px}.kv{margin:10px 0}.kv b{display:block;font-size:17px}
.avatar{width:64px;height:64px;border-radius:50%;background:var(--acc);color:#fff;font-size:30px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 6px}
.burger{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:40;background:var(--acc);color:#fff;border-radius:14px;box-shadow:0 4px 10px #0003}
header{padding-left:56px;min-height:64px}
.scrim{position:fixed;inset:0;background:#0005;z-index:15;display:none}.scrim.open{display:block}
button{transition:transform .1s}button:active{transform:scale(.97)}
.pri,.sec{border-radius:16px;padding:14px 18px;box-shadow:0 3px 8px -3px #0004}.chip{font-weight:700}
#side button{font-weight:700;padding:14px}.dim{font-size:16px}
.datebtn{width:100%;text-align:left;margin:5px 0;border:1.5px solid #0002;background:#fff;font-weight:700;color:var(--acc)}
.cal .mn{flex:1;text-align:center;font-weight:800;text-transform:capitalize;margin-top:12px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-top:10px}.cg small{opacity:.55;font-weight:700}
.day{display:flex;align-items:center;justify-content:center;aspect-ratio:1;border-radius:50%;font-weight:600;cursor:pointer}
.day.td{border:2px solid var(--acc)}.day.on{background:var(--acc);color:#fff}
.codebox{font-size:38px;font-weight:800;letter-spacing:8px;text-align:center;background:#f2f5fa;border-radius:16px;padding:14px;margin:10px 0;color:var(--acc);user-select:all}
.hb img.logo{width:min(66vw,250px);height:auto;border:0;background:none;border-radius:0;display:block;margin:0 auto 2px}.brand .mk{color:#16202e}
.hb img.logo.sm2{width:min(50vw,180px)}
html{-webkit-text-size-adjust:100%}*{-webkit-tap-highlight-color:transparent}button,.chip,.day{touch-action:manipulation}body{overscroll-behavior-y:none;min-height:100dvh}.home{min-height:100dvh}
#side img.logo{width:52%;height:auto;border:0;background:none;border-radius:0;display:block;margin:0 auto 28px}
.lbtn{display:block;width:100%;text-align:left;margin:6px 0;padding:14px;border:2px solid transparent;background:#f2f5fa;font-weight:700}.lbtn.on{border-color:var(--acc);background:#fff;color:var(--acc)}
.swr{position:relative;margin:10px 0;border-radius:20px;overflow:hidden;background:#e5484d}
.swr .card{margin:0;position:relative;touch-action:pan-y;transition:transform .2s;user-select:none;-webkit-user-select:none}.swr.drag .card{transition:none}
.swd{position:absolute;top:0;bottom:0;width:84px;background:#e5484d;color:#fff;font-size:26px;border-radius:0;padding:0}.swd.l{left:0}.swd.r{right:0}
.badge{flex:0;background:var(--acc);color:#fff;border-radius:20px;padding:2px 12px;font-weight:800}
.lsel{display:flex;align-items:center;width:100%;padding:14px;border:2px solid var(--acc);background:#fff;font-weight:700}
.fl{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:20px;margin-right:10px;font-size:20px}.fl svg{width:28px;height:20px;border-radius:3px;box-shadow:0 0 0 1px #0002}
.inv{background:#fff8e1}
header{margin:0 -14px;padding:12px 12px 12px 62px;gap:6px}header h1{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}header button:not(.ic){padding:8px 10px;font-size:13px;white-space:nowrap;flex:none}
header h1.em{font-size:30px;line-height:1.2;overflow:visible;position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;pointer-events:none;padding:0;margin:0}
</style></head><body>

const $=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),uid=()=>Math.random().toString(36).slice(2,10);
const UN=['unitats','kg','g','l','ml','peces'],COL=['#1d5fd1','#0f9d8a','#7c3aed','#d6336c','#e8590c','#2f9e44','#495057'];
let db=null,user=null,me=null,acc=null,S={stores:[],tstores:[],items:[],tasks:[],history:[],refs:[],color:''};
let fn=null,view='main',side=false,allS=false,buying=null,modal=null,cur=null,curDoc=null,unsub=null,sel=null,gate=true,pk=null,tm;
const root=document.documentElement,deep=o=>JSON.parse(JSON.stringify(o));
if(!window.CFG||CFG.url.includes('ENGANXA')){document.body.innerHTML='<p style="padding:24px;font-family:sans-serif">Falta configurar el fitxer config.js (mira LEEME.md).</p>';throw new Error('config');}
let authMode='in',recov=false,bid=null,inv=null;
const SB=window.supabase.createClient(CFG.url,CFG.key);
function shim(){return {doc:p=>{const sh=p.startsWith('shared/'),id=sh?p.split('/').pop():me,T=sh?'shared_docs':'app_data',K=sh?'id':'user_id';
 return {
  async get(){const {data,error}=await SB.from(T).select('data').eq(K,id).maybeSingle();if(error)throw error;return {exists:!!data,data:()=>data.data};},
  async set(d){if(sh){const r=await SB.from(T).update({data:d}).eq('id',id).select('id');if(r.error)throw r.error;if(!r.data.length){const i=await SB.from(T).insert({id,data:d,owner:me});if(i.error)throw i.error;}}
   else{const r=await SB.from(T).upsert({user_id:me,data:d});if(r.error)throw r.error;}},
  onSnapshot(cb,er){const g=()=>this.get().then(cb,er);g();const ch=SB.channel('r'+id+Math.random()).on('postgres_changes',{event:'*',schema:'public',table:T,filter:K+'=eq.'+id},g).subscribe();return ()=>SB.removeChannel(ch);}
 };}};}
async function boot(ss){const id=ss?ss.user.id:'none';if(bid===id)return;bid=id;
 if(ss){me=ss.user.id;db=shim();const m=ss.user.user_metadata||{};
  try{const s=await db.doc('data/users/'+me+'/app').get();if(s.exists)Object.assign(S,s.data());}catch(x){}
  S.profile={nom:m.nom,cognom:m.cognom,user:m.user,email:ss.user.email};gate=false;
  const h=location.hash.match(/[#&]s=(\w+)/);if(h)inv=h[1];}
 else{me=null;db=null;}
 render();}
SB.auth.onAuthStateChange((ev,ss)=>{if(ev=='PASSWORD_RECOVERY'){recov=true;gate=true;render();return;}
 if(ev=='SIGNED_OUT'){location.reload();return;}
 if(ev=='INITIAL_SESSION'||ev=='SIGNED_IN')setTimeout(()=>boot(ss),0);});
function save(){clearTimeout(tm);tm=setTimeout(()=>{if(db&&me)db.doc('data/users/'+me+'/app').set(deep(S)).catch(()=>{});},400);}
function sset(){if(db&&cur&&curDoc)db.doc('shared/'+cur).set(deep(curDoc)).catch(()=>{});}
async function join(id){try{if(db)await SB.rpc('join_shared',{code:id});const s=await db.doc('shared/'+id).get();if(!s.exists)return false;const d=s.data();
 if(!S.refs.some(r=>r.id==id)){S.refs.push({id,kind:d.kind,title:d.title});save();}return d.kind;}catch(x){return false}}
function openSh(id){unsub&&unsub();cur=id;curDoc=null;view='sh';unsub=db.doc('shared/'+id).onSnapshot(s=>{curDoc=s.exists?deep(s.data()):null;if(view=='sh')render(true);},()=>{});render();}
async function share(kind,t){
 if(!db||!me){modal={msg:'Per compartir cal haver iniciat sessió.',info:1};return render();}
 const id=uid()+uid();let d;
 if(kind=='shop')d={kind,title:'Llista de compra',stores:S.stores.filter(s=>S.items.some(i=>i.store==s.id)),items:S.items};
 else d={kind,title:t.title,task:t};
 try{await db.doc('shared/'+id).set(deep(d));}catch(x){modal={msg:'No s\'ha pogut compartir. Cal tenir permís de col·laborador.',info:1};return render();}
 S.refs.push({id,kind,title:d.title});save();
 modal={share:location.href.split('#')[0]+'#s='+id,code:id};render();}
const ask=(msg,ok)=>{modal={msg,ok};render();};
const sName=(list,id)=>(list.find(s=>s.id==id)||{}).name||'';
function storePick(list,sid,lb,ph){pk=sid||null;return `<label>${lb||'Botiga'}</label><div id="chips">${list.map(s=>`<span class="chip ${s.id==sid?'on':''}" data-a="pick" data-id="${s.id}">${e(s.name)}</span>`).join('')}</div><input id="ns" placeholder="${ph?(list.length?ph:'Nom del nou lloc'):(list.length?'+ Nova botiga':'Nom de la nova botiga')}">`;}
function resolveStore(list){const n=($('#ns').value||'').trim();if(n){let s=list.find(x=>x.name.toLowerCase()==n.toLowerCase());if(!s){s={id:uid(),name:n};list.push(s);}return s.id;}return pk;}
const fmtD=d=>d?new Date(d+'T00:00').toLocaleDateString(LOC(),{weekday:'short',day:'numeric',month:'short'}):'Sense data';
const unitSel=u=>`<select id="u">${UN.map(x=>`<option ${x==u?'selected':''}>${x}</option>`).join('')}</select>`;
const itLine=i=>`${e(i.name)} <small>(${e(i.qty)} ${e(i.unit)})${i.date?' · 📅 '+fmtD(i.date):''}</small>`;

function newShop(){return `<div class="card"><label>Producte</label><input id="n" placeholder="Ex.: Mandarines" autofocus>
<div class="row"><div><label>Quantitat</label><input id="q" type="number" min="0" step="any" value="1"></div><div><label>Unitat</label>${unitSel()}</div></div>
${storePick(S.stores)}<button class="pri" style="width:100%;margin-top:12px" data-a="saveItem">Guardar</button></div>`;}
function shopMain(){
 const st=S.stores.filter(s=>allS||S.items.some(i=>i.store==s.id));
 return `<button class="pri" style="width:100%;font-size:18px" data-a="startbuy" ${S.items.length?'':'disabled'}>Començar compra</button>
 <h3>${allS?'Tots els supermercats':'Botigues amb productes pendents'}</h3>
 ${st.map(s=>`<div class="card"><h4>${e(s.name)}</h4>${S.items.filter(i=>i.store==s.id).map(i=>`<div class="it"><span>${itLine(i)}</span><button data-a="delItem" data-id="${i.id}">✕</button></div>`).join('')||'<div class="dim" style="padding:6px">Res pendent</div>'}</div>`).join('')||'<div class="dim">No hi ha productes pendents.<br>Afegeix-ne amb «Nou Producte».</div>'}
 `;}
function buyView(){
 return S.stores.filter(s=>(buyScope||[]).includes(s.id)&&S.items.some(i=>i.store==s.id)).map(s=>`<div class="card"><h4>${e(s.name)}</h4>${S.items.filter(i=>i.store==s.id).map(i=>`<label class="it" style="opacity:1;font-size:16px"><input type="checkbox" data-a="chk" data-id="${i.id}" ${buying[i.id]?'checked':''}><span>${itLine(i)}</span></label>`).join('')}</div>`).join('')+`<button class="pri" style="width:100%;margin-top:10px" data-a="finish">Finalitzar compra</button>`;}
function histView(){
 if(sel){const h=S.history.find(x=>x.id==sel);if(h){const g=a=>a.map(i=>`<div class="it"><span>${itLine(i)} · <small>${e(i.sn)}</small></span></div>`).join('')||'<div class="dim" style="padding:6px">Cap</div>';
  return `<button class="sec" data-a="histBack">‹ Enrere</button><div class="card"><h4>${new Date(h.ts).toLocaleString(LOC())}</h4><b>Botigues:</b> ${e([...new Set(h.bought.concat(h.pending).map(i=>i.sn))].join(', ')||'—')}</div><div class="card"><h4>Comprats</h4>${g(h.bought)}</div><div class="card"><h4>Pendents</h4>${g(h.pending)}</div>`;}}
 return S.history.map(h=>`<div class="card" data-a="histOpen" data-id="${h.id}"><b>${new Date(h.ts).toLocaleString(LOC())}</b><br><small>${h.bought.length} comprats · ${h.pending.length} pendents</small></div>`).join('')||'<div class="dim">Encara no hi ha compres finalitzades.</div>';}
function taskForm(t,d){t=t||{};return `<div class="card"><label>Què s'ha de fer</label><input id="t_title" value="${e(t.title)}" placeholder="Ex.: Anar a la perruqueria">
<label>Descripció</label><textarea id="t_desc" rows="3">${e(t.desc)}</textarea>
<div class="row"><div><label>Dia</label>${dateField('t_date',t.date)}</div><div><label>Hora (opcional)</label><input id="t_time" type="time" value="${e(t.time)}"></div></div>
<label>Carrer, lloc i detalls</label><input id="t_addr" value="${e(t.addr)}">${d?(pk=null,`<label>Lloc</label><input id="ns" value="${e(t.place!=null?t.place:sName(S.tstores,t.store))}" placeholder="Lloc">`):storePick(S.tstores,t.store,'Triar lloc','+ Nou lloc')}</div>`;}
function readTask(){const title=$('#t_title').value.trim();if(!title){modal={msg:'Cal escriure què s\'ha de fer.',info:1};render();return null;}
 return {title,desc:$('#t_desc').value,date:$('#t_date').value,time:$('#t_time').value,addr:$('#t_addr').value,store:resolveStore(S.tstores)};}
function taskMain(){const L=[...S.tasks].sort((a,b)=>(a.date||'9')+(a.time||'')>(b.date||'9')+(b.time||'')?1:-1);
 return L.map(t=>`<div class="card" data-a="openTask" data-id="${t.id}"><b>${e(t.title)}</b>${t.time?' · '+e(t.time):''}<br><small>${fmtD(t.date)}${t.store?' · '+e(sName(S.tstores,t.store)):''}</small></div>`).join('')||'<div class="dim">No tens encàrrecs.<br>Crea\'n un amb «Nova Tasca».</div>';}
function detail(){const t=S.tasks.find(x=>x.id==sel);if(!t)return'';return `<button class="sec" data-a="menu">‹ Enrere</button>${taskForm(t,1)}<div class="hrow"><button class="pri" data-a="updTask">Guardar</button><button class="sec" data-a="shareTask">Compartir</button><button data-a="delTask" style="color:#b3261e;font-weight:600">Eliminar</button></div><button class="pri" style="width:100%;margin-top:10px;background:#2f9e44" data-a="doneTask" data-id="${t.id}">✅ Marcar com a feta</button>`;}
function sharedList(){const k=fn;
 return `<div class="card"><label>Afegir una llista amb un codi</label><div class="row"><input id="code" placeholder="Codi"><button class="pri" style="flex:0" data-a="joinCode">Afegir</button></div></div>`+
 (S.refs.filter(r=>r.kind==k).map(r=>`<div class="card row"><div data-a="openSh" data-id="${r.id}" style="flex:1"><b>${e(r.title)}</b></div><button style="flex:0;color:#b3261e" data-a="leave" data-id="${r.id}">✕</button></div>`).join('')||'<div class="dim">Encara no tens res compartit.</div>');}
function shView(){
 if(!curDoc)return '<div class="dim">Carregant…</div>';const d=curDoc;
 if(d.kind=='task'){const t=d.task;return `<button class="sec" data-a="shBack">‹ Enrere</button>${taskForm({...t,place:t.storeName||''},1)}<button class="pri" style="width:100%" data-a="saveShTask">Guardar canvis</button>`;}
 return `<button class="sec" data-a="shBack">‹ Enrere</button><div class="card"><div class="row"><input id="n" placeholder="Producte"><input id="q" type="number" value="1" style="flex:.5">${unitSel()}</div>
 <input id="ns" list="dl" placeholder="Botiga"><datalist id="dl">${d.stores.map(s=>`<option value="${e(s.name)}">`).join('')}</datalist><button class="pri" style="width:100%;margin-top:8px" data-a="shAdd">Afegir</button></div>`+
 d.stores.filter(s=>d.items.some(i=>i.store==s.id)).map(s=>`<div class="card"><h4>${e(s.name)}</h4>${d.items.filter(i=>i.store==s.id).map(i=>`<div class="it"><input type="checkbox" data-a="shChk" data-id="${i.id}" ${i.done?'checked':''}><span style="${i.done?'text-decoration:line-through;opacity:.5':''}">${itLine(i)}</span><button data-a="shDel" data-id="${i.id}">✕</button></div>`).join('')}</div>`).join('')||'<div class="dim">Llista buida.</div>';}
function editStores(){const k=fn=='shop'?'stores':'tstores';
 return `<div class="card">${S[k].map(s=>`<div class="it"><input data-a="ren" data-id="${s.id}" value="${e(s.name)}"><button data-a="delStore" data-id="${s.id}">✕</button></div>`).join('')||'<div class="dim">Cap botiga.</div>'}</div><div class="card"><div class="row"><input id="nst" placeholder="Nova botiga"><button class="pri" style="flex:0" data-a="addStore">Afegir</button></div></div>`;}
function account(){const a=acc||{};return `<div class="card"><label>Nom</label><div><b>${e(a.name||'—')}</b></div><label>Correu electrònic</label><div><b>${e(a.email||'—')}</b></div></div>
 ${me?'':'<div class="warn">Sessió no iniciada: les dades són temporals.</div>'}<button class="pri" style="width:100%" data-a="colors">Canviar el color de l'aplicació</button>`;}

const TITLES={main:()=>fn=='shop'?'Supermercat':'Encàrrecs',new:()=>fn=='shop'?'Nou producte':'Nova tasca',hist:()=>fn=='shop'?'Historial de compres':'Historial de tasques',shared:()=>fn=='shop'?'Llistes compartides':'Tasques compartides',edit:()=>fn=='shop'?'Editar supermercats':'Editar botigues',account:()=>'Compte',buy:()=>'Compra en curs',detail:()=>'Encàrrec',sh:()=>'Llista compartida'};
function body(){
 switch(view){case 'main':return fn=='shop'?shopMain():taskMain();case 'new':return fn=='shop'?newShop():taskForm().replace('<div class="card">','<div class="card"><div class="ttl">📝 Nova tasca</div>')+'<button class="pri" style="width:100%" data-a="saveTask">Guardar</button>';
 case 'cfg':return cfgView();case 'tedit':return taskEditView();case 'store':return storeView();case 'hist':return fn=='task'?taskHist():histView();case 'shared':return sharedList();case 'edit':return editStores();case 'account':return account();case 'buy':return buyView();case 'detail':return detail();case 'sh':return shView();}}
function modalHtml(){const m=modal;if(!m)return'';let h='';
 if(m.share)h=`<h3>Llista compartida</h3><p>Envia aquest enllaç. La persona haurà d'obrir l'aplicació amb sessió iniciada i amb accés a la pàgina.</p><input readonly value="${e(m.share)}" onclick="this.select()"><div class="codebox">${m.code}</div><p class="note">Digues-li aquest codi: l'haurà d'escriure a l'apartat de compartits.</p><div class="hrow"><button class="pri" data-a="copy">Copiar</button><a href="https://wa.me/?text=${encodeURIComponent(m.share+' (codi: '+m.code+')')}" target="_blank" rel="noopener" style="flex:1"><button class="sec" style="width:100%">WhatsApp</button></a></div><div class="hrow"><button data-a="close" style="width:100%">Tancar</button></div>`;
 else if(m.pickst)h=pickHtml(m);
 else if(m.cal)h=calHtml(m.cal);
 else if(m.colors)h=`<h3>Color</h3><div>${COL.map(c=>`<span class="sw" style="background:${c}" data-a="pickcol" data-c="${c}"></span>`).join('')}</div><div class="hrow"><button data-a="close" style="width:100%">Tornar enrere</button></div>`;
 else if(m.keep)h=`<p>${m.msg} Què vols fer amb els productes sense comprar?</p><div class="hrow"><button class="pri" data-a="keep1">Conservar-los</button><button data-a="keep0" style="color:#b3261e">Eliminar-los</button></div>`;
 else if(m.info)h=`<p>${m.msg}</p><div class="hrow"><button class="pri" data-a="close" style="width:100%">D'acord</button></div>`;
 else h=`<p>${m.msg}</p><div class="hrow"><button class="pri" data-a="ok">Confirmar</button><button data-a="close">Tornar enrere</button></div>`;
 return `<div id="md"><div>${h}</div></div>`;}
function sideHtml(){const s=fn=='shop';return `<div id="side" class="${side?'open':''}"><button class="new" data-a="${s?'nav-new':'nav-new'}">${s?'+ Nou Producte':'+ Nova Tasca'}</button>
<button data-a="nav-main">Menú Principal</button>${s?'<button data-a="nav-hist">Historial de compres</button>':''}<button data-a="nav-shared">${s?'Llistes compartides':'Tasques compartides'}</button><button data-a="nav-edit">${s?'Editar supermercats':'Editar botigues'}</button><button data-a="nav-account">Compte</button><button data-a="swap">Canviar de funció</button></div>`;}
function render(keep){
 root.style.setProperty('--acc',S.color||'#1d5fd1');
 root.style.setProperty('--bg',S.color?`color-mix(in srgb,${S.color} 14%,#fff)`:(fn=='task'?'#ffe6cc':'#dcefff'));
 let h;
 if(gate){h=`<h1 style="margin-top:50px">Compres i Encàrrecs</h1><p>Per desar les dades al núvol i compartir llistes cal obrir aquesta pàgina amb la sessió iniciada.</p><div class="warn">Si continues sense registrar-te, els canvis no es conservaran en tancar o abandonar l'aplicació.</div><button class="pri" style="width:100%" data-a="guest">Continuar sense registrar-se</button>`;}
 else if(!fn){h=`<h1 style="margin:40px 0 10px">Què vols fer?</h1><button class="big" data-a="go-shop">Supermercat</button><button class="big" data-a="go-task" style="background:#e8590c">Encàrrecs</button>`;}
 else h=sideHtml()+`<header><button class="ic burger" data-a="side">☰</button><h1>${TITLES[view]()}</h1>${view=='main'&&fn=='shop'&&!buying?'<button class="sec" data-a="share-shop">Compartir</button>':''}</header>`+body();
 const a=$('#app');const sc=scrollY;a.innerHTML=h+modalHtml();if(keep)scrollTo(0,sc);}
function go(v){if(unsub&&v!='sh'){unsub();unsub=null;}view=v;side=false;sel=null;editId=null;render();}
document.addEventListener('click',async ev=>{const t=ev.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,id=t.dataset.id;
 if(a=='pick'){pk=pk==id?null:id;document.querySelectorAll('#chips .chip').forEach(c=>c.classList.toggle('on',c.dataset.id==pk));return;}
 if(a=='ren'||a=='chk'||a=='shChk'){if(a=='chk'){buying[id]=t.checked;}if(a=='shChk'){const i=curDoc.items.find(x=>x.id==id);i.done=t.checked;sset();render(true);}return;}
 switch(a){
 case 'guest':gate=false;render();break;
 case 'go-shop':fn='shop';go('new');break;case 'go-task':fn='task';go('new');break;
 case 'side':side=!side;$('#side').classList.toggle('open',side);$('#scrim').classList.toggle('open',side);$('.burger').textContent=side?'✕':'☰';break;
 case 'nav-new':if(buying){side=false;modal={msg:'No es poden afegir productes durant la compra.',info:1};render();}else go('new');break;
 case 'nav-main':buying=null;go('main');break;case 'nav-hist':go('hist');break;case 'nav-shared':go('shared');break;case 'nav-edit':go('edit');break;case 'nav-account':go('account');break;
 case 'swap':side=false;ask('Vols canviar de funció? Tornaràs a la pàgina principal.',()=>{fn=null;buying=null;go('main');});break;
 case 'toggleAll':allS=!allS;render();break;
 case 'saveItem':{const n=$('#n').value.trim();if(!n){modal={msg:'Escriu el nom del producte.',info:1};return render();}
  const st=resolveStore(S.stores);if(!st){modal={msg:'Selecciona o crea una botiga.',info:1};return render();}
  const o={name:n,qty:$('#q').value||'1',unit:$('#u').value,store:st,date:$('#d').value};if(editId){Object.assign(S.items.find(x=>x.id==editId),o);editId=null;save();sel=st;view='store';render();break;}S.items.push({id:uid(),...o});save();go('main');break;}
 case 'delItem':{const i=S.items.find(x=>x.id==id);ask(`Vols eliminar ${i.name}?`,()=>{S.items=S.items.filter(x=>x.id!=id);save();});break;}
 case 'startbuy':{const ids=S.stores.filter(x=>S.items.some(i=>i.store==x.id)).map(x=>x.id);modal={pickst:ids.slice(),all:ids};render();break;}
 case 'finish':{const un=inScope().filter(i=>!buying[i.id]);if(un.length){modal={msg:`Queden ${un.length} productes sense comprar.`,keep:1};render();}else commit(false);break;}
 case 'keep1':commit(true);break;case 'keep0':commit(false);break;
 case 'histOpen':sel=id;render();break;case 'histBack':sel=null;render();break;
 case 'saveTask':{const t=readTask();if(!t)return;S.tasks.push({id:uid(),...t});save();go('main');break;}
 case 'openTask':sel=id;view='detail';render();break;case 'menu':go('main');break;
 case 'updTask':{const t=readTask();if(!t)return;Object.assign(S.tasks.find(x=>x.id==sel),t);save();view='detail';render();break;}
 case 'delTask':{const t=S.tasks.find(x=>x.id==sel);ask(`Vols eliminar ${t.title}?`,()=>{S.tasks=S.tasks.filter(x=>x.id!=t.id);save();go('main');});break;}
 case 'share-shop':share('shop');break;
 case 'shareTask':{const k=S.tasks.find(x=>x.id==sel);share('task',{...k,storeName:sName(S.tstores,k.store)});break;}
 case 'joinCode':{const c=$('#code').value.trim().toUpperCase();const k=c&&await join(c);if(!k||k!=fn){modal={msg:'No s\'ha trobat cap llista amb aquest codi.',info:1};}render();break;}
 case 'openSh':openSh(id);break;case 'shBack':go('shared');break;
 case 'leave':ask('Vols eliminar la llista compartida de la teva llista?',()=>{S.refs=S.refs.filter(r=>r.id!=id);save();});break;
 case 'shAdd':{const n=$('#n').value.trim(),sn=$('#ns').value.trim();if(!n||!sn)return;let s=curDoc.stores.find(x=>x.name.toLowerCase()==sn.toLowerCase());if(!s){s={id:uid(),name:sn};curDoc.stores.push(s);}
  curDoc.items.push({id:uid(),name:n,qty:$('#q').value||'1',unit:$('#u').value,store:s.id});sset();render();break;}
 case 'shDel':{const i=curDoc.items.find(x=>x.id==id);ask(`Vols eliminar ${i.name}?`,()=>{curDoc.items=curDoc.items.filter(x=>x.id!=id);sset();});break;}
 case 'saveShTask':{const n=$('#ns').value.trim();const t=readTaskSh();if(!t)return;curDoc.task=t;sset();modal={msg:'Canvis desats.',info:1};render();break;}
 case 'addStore':{const n=$('#nst').value.trim();if(!n)return;S[fn=='shop'?'stores':'tstores'].push({id:uid(),name:n});save();render();break;}
 case 'delStore':{const k=fn=='shop'?'stores':'tstores',s=S[k].find(x=>x.id==id);ask(fn=='shop'&&S.items.some(i=>i.store==id)?`Vols eliminar ${s.name}? També s'eliminaran els seus productes pendents.`:`Vols eliminar ${s.name}?`,()=>{S[k]=S[k].filter(x=>x.id!=id);if(fn=='shop')S.items=S.items.filter(i=>i.store!=id);save();});break;}
 case 'colors':modal={colors:1};render();break;
 case 'pickcol':{const c=t.dataset.c;ask('Vols aplicar aquest color a tota l\'aplicació?',()=>{S.color=c;save();});break;}
 case 'copy':try{await navigator.clipboard.writeText(modal.share);t.textContent='Copiat ✓';}catch(x){document.querySelector('#md input').select();}break;
 case 'ok':{const f=modal.ok;modal=null;f();render();break;}
 case 'close':modal=null;render();break;}
});
document.addEventListener('change',ev=>{const t=ev.target;if(t.dataset.a=='ren'){const k=fn=='shop'?'stores':'tstores';const s=S[k].find(x=>x.id==t.dataset.id);if(s&&t.value.trim()){s.name=t.value.trim();save();}}});
function readTaskSh(){const title=$('#t_title').value.trim();if(!title)return null;return {title,desc:$('#t_desc').value,date:$('#t_date').value,time:$('#t_time').value,addr:$('#t_addr').value,storeName:$('#ns').value.trim()};}
function commit(keep){const nm=i=>({...i,sn:sName(S.stores,i.store)});
 const b=S.items.filter(i=>buying[i.id]).map(nm),u=inScope().filter(i=>!buying[i.id]).map(nm);
 S.history.unshift({id:uid(),ts:Date.now(),bought:b,pending:u});S.curCode=null;S.scodes={};S.items=S.items.filter(i=>!buying[i.id]&&(keep||!(buyScope||[]).includes(i.store)));
 buying=null;buyScope=null;modal=null;save();go('main');}
const IC={main:'🏠',new:'➕',hist:'🧾',shared:'🤝',edit:'✏️',account:'👤',buy:'✅',detail:'📝',sh:'🤝'};
const brand=()=>`<div class="hb"><img class="logo" src="${LOGO}" alt="MarketList"><div class="brand"><span class="mk">Market</span>List</div></div>`;
function homeHtml(){return `<div class="home"><div class="hb"><img class="logo" src="${LOGO}" alt="MarketList"></div><div class="hm">${invBanner()}<button class="tile" style="background:linear-gradient(135deg,#59b0ff,#1d5fd1)" data-a="go-shop"><i>🛒</i><span>Supermercat<small>La teva llista de la compra</small></span></button><button class="tile" style="background:linear-gradient(135deg,#ffb24d,#e8590c)" data-a="go-task"><i>📋</i><span>Encàrrecs<small>Tasques i recordatoris</small></span></button></div></div>`;}
function authHtml(){const reg=db&&me;return `<div class="home"><div class="hb"><img class="logo sm2" src="${LOGO}" alt="MarketList"></div><div class="hm"><div class="card pad">`+(reg?`<div class="ttl">👋 Crea el teu compte</div><input id="r_n" placeholder="Nom"><input id="r_c" placeholder="Cognom"><input id="r_u" placeholder="Nom d'usuari"><input id="r_e" type="email" placeholder="Correu electrònic"><button class="pri" style="width:100%;margin-top:10px" data-a="reg">Registrar-me i entrar</button><div class="note">Entres amb la teva sessió de claude.ai, per això no hi ha contrasenya pròpia.</div>`:`<div class="ttl">🔐 Inicia sessió</div><p>Per desar les dades al núvol i compartir llistes, obre MarketList amb la sessió de claude.ai iniciada.</p>`)+`</div><div class="warn">Si continues sense registrar-te, els canvis no es conservaran en tancar o abandonar l'aplicació.</div><button class="sec" style="width:100%" data-a="guest">Continuar sense registrar-se</button></div></div>`;}

function calHtml(c){const f=new Date(c.y,c.m,1),n=new Date(c.y,c.m+1,0).getDate(),off=(f.getDay()+6)%7,cur=$('#'+c.t).value,days=[];
 for(let i=0;i<off;i++)days.push('<span></span>');
 for(let d=1;d<=n;d++){const iso=`${c.y}-${String(c.m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;days.push(`<b class="day ${iso==cur?'on':''} ${iso==tod()?'td':''}" data-a="day" data-v="${iso}">${d}</b>`);}
 return `<div class="cal"><div class="hrow" style="margin:0"><button data-a="cm" data-d="-1">‹</button><div class="mn">${f.toLocaleDateString(LOC(),{month:'long',year:'numeric'})}</div><button data-a="cm" data-d="1">›</button></div><div class="cg">${WD().map(x=>`<small>${x}</small>`).join('')}${days.join('')}</div><div class="hrow"><button data-a="day" data-v="">Sense data</button><button data-a="closeMd">Tancar</button></div></div>`;}

 if(a=='cal'){const v=$('#'+t.dataset.t).value,d=v?new Date(v+'T00:00'):new Date();modal={cal:{y:d.getFullYear(),m:d.getMonth(),t:t.dataset.t}};mdUpdate();}
 else if(a=='cm'){const c=modal.cal,d=new Date(c.y,c.m+ +t.dataset.d,1);c.y=d.getFullYear();c.m=d.getMonth();mdUpdate();}
 else if(a=='day'){const id=modal.cal.t,v=t.dataset.v;$('#'+id).value=v;$('#'+id+'_b').textContent='📅 '+(v?fmtD(v):'Tria un dia');modal=null;mdUpdate();}

const genCode=()=>Array.from({length:6},()=>'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[Math.random()*31|0]).join('');
async function share(kind,t){
 if(!db||!me){modal={msg:'Per compartir cal haver iniciat sessió.',info:1};return render();}
 const tk=S.tasks.find(x=>x.id==sel);let id=kind=='shop'?S.curCode:kind=='store'?(S.scodes||{})[t]:(tk||{}).code,ok=false;
 if(id){try{ok=(await db.doc('shared/'+id).get()).exists;}catch(x){}}
 for(let k=0;k<6&&!ok;k++){id=genCode();let ex=true;try{ex=(await db.doc('shared/'+id).get()).exists;}catch(x){}
  if(ex)continue;
  const st1=kind=='store'?S.stores.find(x=>x.id==t):null,d=kind=='store'?{kind:'shop',title:st1.name,stores:[st1],items:S.items.filter(i=>i.store==t)}:kind=='shop'?{kind,title:'Llista de compra',stores:S.stores.filter(s=>S.items.some(i=>i.store==s.id)),items:S.items}:{kind,title:t.title,task:t};
  try{await db.doc('shared/'+id).set(deep(d));ok=true;}catch(x){break;}
  S.refs.push({id,kind:d.kind,title:d.title});if(kind=='shop')S.curCode=id;else if(kind=='store'){(S.scodes=S.scodes||{})[t]=id;}else if(tk)tk.code=id;save();}
 if(!ok){modal={msg:`No s'ha pogut compartir. Cal tenir permís de col·laborador.`,info:1};return render();}
 modal={share:location.href.split('#')[0]+'#s='+id,code:id};render();}
